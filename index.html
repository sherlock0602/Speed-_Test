<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐾 走廊小精靈 // 測速雷達究極版 🐾</title>
    <style>
        body {
            background-color: #E3F2FD;
            font-family: 'Microsoft JhengHei', 'Varela Round', sans-serif;
            color: #455A64;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #FFFFFF;
            border: 3px dashed #90CAF9;
            border-radius: 15px;
            padding: 25px;
            width: 90%;
            max-width: 640px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        .title-badge {
            background-color: #90CAF9;
            color: white;
            padding: 5px 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            display: inline-block;
            margin-top: -40px;
            margin-bottom: 15px;
        }
        .control-group {
            margin-bottom: 12px;
            font-weight: bold;
        }
        input[type="text"] {
            width: calc(100% - 20px);
            padding: 8px;
            border: 2px solid #BBDEFB;
            border-radius: 8px;
            font-family: monospace;
            margin-top: 5px;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #42A5F5;
        }
        input[type="number"] {
            width: 70px;
            padding: 5px;
            border: 2px solid #90CAF9;
            border-radius: 5px;
            text-align: center;
            color: #455A64;
            font-weight: bold;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            margin-top: 15px;
            background: #FFF3E0;
            padding: 10px;
            border-radius: 10px;
        }
        .btn {
            background-color: #81C784;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn.stop { background-color: #E57373; }
        .btn:disabled { background-color: #CFD8DC; cursor: not-allowed; }
        
        #canvasOutput {
            width: 100%;
            max-width: 640px;
            border: 3px dashed #90CAF9;
            border-radius: 15px;
            margin-top: 20px;
            background-color: #FFF;
        }

        .gallery-container {
            width: 90%;
            max-width: 640px;
            margin-top: 20px;
            background-color: #FFFFFF;
            border: 3px dashed #FFB6C1;
            border-radius: 15px;
            padding: 20px;
        }
        .gallery-title {
            color: #E91E63;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
            text-align: center;
        }
        #gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .snap-img {
            width: 180px;
            border-radius: 8px;
            border: 2px solid #FFCDD2;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .snap-img:hover {
            transform: scale(1.05);
            border-color: #E91E63;
        }
        
        #videoElement, #ipcamElement, #hiddenCanvas { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="title-badge">✨ 雷達設定與魔法區 ✨</div>
        
        <div class="control-group">
            <label>📱 鏡頭來源 (本機鏡頭填 0，平板請填 IP 網址)</label>
            <input type="text" id="camSource" value="0" placeholder="例如: http://192.168.1.100:8080/video">
        </div>

        <div class="control-group" style="display: flex; justify-content: space-between; align-items: center; background: #F5F5F5; padding: 10px; border-radius: 10px;">
            <span>📏 請看畫面左上角紅線 (100像素)<br>這條紅線在現實中大約是幾公尺？</span>
            <input type="number" id="calibInput" value="0.1" step="0.1" min="0.1">
        </div>

        <div class="control-group">
            <label id="speedLabel">🚨 抓拍速限: 大於 0.5 m/s (公尺/秒) 才拍照</label>
            <input type="range" id="speedSlider" min="0.5" max="10.0" step="0.5" value="0.5">
        </div>
        
        <div class="control-group">
            <label id="trigLabel">⏱️ 防誤判 (連續超速幾張畫面才拍): 1</label>
            <input type="range" id="trigSlider" min="1" max="15" value="1">
        </div>

        <label class="checkbox-label">
            <input type="checkbox" id="powerCheck">
            💤 啟用睡覺模式 (關閉畫面，背景默默抓拍超省電)
        </label>

        <button id="startBtn" class="btn" disabled>⏳ 載入魔法核心中 (請稍候)...</button>
    </div>

    <!-- 視覺顯示畫布 -->
    <canvas id="canvasOutput" width="640" height="480"></canvas>

    <!-- 照片紀錄區 (相簿) -->
    <div class="gallery-container">
        <div class="gallery-title">📸 違規抓拍紀錄區 (點擊照片即可下載)</div>
        <div id="gallery"></div>
    </div>

    <!-- 隱藏的工作元件 -->
    <video id="videoElement" width="640" height="480" autoplay playsinline></video>
    <img id="ipcamElement" width="640" height="480" crossorigin="anonymous">
    <canvas id="hiddenCanvas" width="640" height="480"></canvas> 

    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>

    <script>
        let video = document.getElementById('videoElement');
        let ipcam = document.getElementById('ipcamElement');
        let canvas = document.getElementById('canvasOutput');
        let ctx = canvas.getContext('2d');
        let hiddenCanvas = document.getElementById('hiddenCanvas');
        let hCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });
        let gallery = document.getElementById('gallery');
        
        let startBtn = document.getElementById('startBtn');
        let speedSlider = document.getElementById('speedSlider');
        let trigSlider = document.getElementById('trigSlider');
        let calibInput = document.getElementById('calibInput');
        let camSourceInput = document.getElementById('camSource');
        let powerCheck = document.getElementById('powerCheck');
        
        let streaming = false;
        let useIpCam = false;
        let src, gray, prevGray, diff, thresh, contours, hierarchy;
        
        let speeding_counter = 0;
        let prev_cx = 0, prev_cy = 0;
        let last_time = 0;
        let last_capture_time = 0;
        let smoothed_speed = 0;

        function onOpenCvReady() {
            startBtn.disabled = false;
            startBtn.innerText = '🌟 開始測速 🌟';
            drawZzzCanvas("(๑• . •๑) 等待打開眼睛...");
        }

        function drawZzzCanvas(text) {
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#90CAF9";
            ctx.font = "bold 24px 'Microsoft JhengHei'";
            ctx.textAlign = "center";
            ctx.fillText(text, canvas.width/2, canvas.height/2);
        }

        speedSlider.oninput = function() { document.getElementById('speedLabel').innerText = `🚨 抓拍速限: 大於 ${this.value} m/s (公尺/秒) 才拍照`; }
        trigSlider.oninput = function() { document.getElementById('trigLabel').innerText = `⏱️ 防誤判 (連續超速幾張畫面才拍): ${this.value}`; }
        powerCheck.onchange = function() {
            if(streaming && this.checked) {
                drawZzzCanvas("( ˘ω˘ ) 睡覺模式運作中... 背景抓拍不漏接！");
            }
        }

        startBtn.addEventListener('click', () => {
            if (!streaming) {
                let sourceValue = camSourceInput.value.trim();
                if (sourceValue === '0') {
                    useIpCam = false;
                    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: 640, height: 480 }, audio: false })
                    .then(function(stream) {
                        video.srcObject = stream;
                        video.play();
                        initOpenCVAndStart();
                    })
                    .catch(err => alert("無法存取本機鏡頭！"));
                } else {
                    useIpCam = true;
                    ipcam.src = sourceValue + (sourceValue.includes('?') ? '&' : '?') + new Date().getTime(); 
                    initOpenCVAndStart();
                }
            } else {
                if(!useIpCam && video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                    video.srcObject = null;
                }
                ipcam.src = "";
                streaming = false;
                startBtn.innerText = '🌟 開始測速 🌟';
                startBtn.classList.remove('stop');
                drawZzzCanvas("(－_－) zzZ 休息中");
            }
        });

        function initOpenCVAndStart() {
            streaming = true;
            startBtn.innerText = '🛑 停止測速 🛑';
            startBtn.classList.add('stop');
            
            setTimeout(() => {
                src = new cv.Mat(480, 640, cv.CV_8UC4);
                gray = new cv.Mat(480, 640, cv.CV_8UC1);
                prevGray = new cv.Mat(480, 640, cv.CV_8UC1);
                diff = new cv.Mat(480, 640, cv.CV_8UC1);
                thresh = new cv.Mat(480, 640, cv.CV_8UC1);
                contours = new cv.MatVector();
                hierarchy = new cv.Mat();
                last_time = performance.now();
                requestAnimationFrame(processVideo);
            }, 1000);
        }

        function processVideo() {
            if (!streaming) return;
            
            try {
                if (useIpCam) {
                    hCtx.drawImage(ipcam, 0, 0, 640, 480);
                } else {
                    hCtx.drawImage(video, 0, 0, 640, 480);
                }
                
                src.data.set(hCtx.getImageData(0, 0, 640, 480).data);
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                
                if (prevGray.empty()) {
                    gray.copyTo(prevGray);
                    requestAnimationFrame(processVideo);
                    return;
                }

                // 【修正2 & 3】：調降門檻，讓室內揮手更容易被偵測到
                cv.absdiff(gray, prevGray, diff);
                cv.threshold(diff, thresh, 25, 255, cv.THRESH_BINARY); // 原本 40 改 25
                cv.findContours(thresh, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let maxArea = 0;
                let maxRect = null;

                for (let i = 0; i < contours.size(); i++) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt);
                    // 【修正2】：面積大於 500 就追蹤 (原本是 1500，對揮手來說太嚴格)
                    if (area > 500 && area > maxArea) {
                        maxArea = area;
                        maxRect = cv.boundingRect(cnt);
                    }
                }

                let now = performance.now();
                let dt = (now - last_time) / 1000.0;
                let isSpeeding = false;
                let display_speed = 0;

                if (maxRect) {
                    let cx = maxRect.x + maxRect.width / 2;
                    let cy = maxRect.y + maxRect.height / 2;

                    if (prev_cx !== 0 && prev_cy !== 0 && dt > 0) {
                        let px_dist = Math.hypot(cx - prev_cx, cy - prev_cy);
                        let meters_per_px = parseFloat(calibInput.value) / 100.0;
                        let dist_meters = px_dist * meters_per_px;
                        
                        let current_speed_ms = dist_meters / dt; 
                        smoothed_speed = (smoothed_speed * 0.7) + (current_speed_ms * 0.3);
                    }
                    prev_cx = cx;
                    prev_cy = cy;

                    display_speed = Math.round(smoothed_speed * 10) / 10;
                    let speedLimit = parseFloat(speedSlider.value);
                    isSpeeding = (display_speed > speedLimit);

                    hCtx.strokeStyle = isSpeeding ? "#FF3366" : "#42A5F5";
                    // 如果超速，把紅框加粗，看起來更明顯！
                    hCtx.lineWidth = isSpeeding ? 8 : 4; 
                    hCtx.strokeRect(maxRect.x, maxRect.y, maxRect.width, maxRect.height);
                    
                    hCtx.fillStyle = isSpeeding ? "#FF3366" : "#42A5F5";
                    hCtx.font = "bold 36px 'Microsoft JhengHei'";
                    hCtx.textAlign = "left";
                    hCtx.fillText(`${display_speed} m/s`, maxRect.x, maxRect.y - 15);

                    // 【修正1】：拔掉原本大於 2 才計數的保險鎖，改成大於 0.1 即可
                    if (isSpeeding && display_speed > 0.1) {
                        speeding_counter++;
                    } else {
                        speeding_counter = Math.max(0, speeding_counter - 1);
                    }

                    if (speeding_counter >= parseInt(trigSlider.value) && (now - last_capture_time > 2000)) {
                        hCtx.fillStyle = "#FF0000";
                        hCtx.fillText("📸 超速抓拍！", maxRect.x, maxRect.y - 60);
                        
                        addPhotoToGallery();
                        
                        last_capture_time = now;
                        speeding_counter = 0;
                    }
                } else {
                    prev_cx = 0;
                    prev_cy = 0;
                    smoothed_speed *= 0.8; 
                }

                let isSleeping = powerCheck.checked;
                if (!isSleeping) {
                    ctx.drawImage(hiddenCanvas, 0, 0);
                    
                    ctx.strokeStyle = "#FF3B30";
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.moveTo(20, 50);
                    ctx.lineTo(120, 50); 
                    ctx.stroke();
                    
                    ctx.fillStyle = "#FF3B30";
                    ctx.font = "bold 18px 'Microsoft JhengHei'";
                    ctx.textAlign = "left";
                    ctx.fillText("← 這條線是 100 像素 →", 15, 35);
                }

                last_time = now;
                gray.copyTo(prevGray);
                requestAnimationFrame(processVideo);

            } catch (err) {
                if(!powerCheck.checked) {
                    drawZzzCanvas("鏡頭連線異常 / 畫面讀取中...");
                }
                requestAnimationFrame(processVideo);
            }
        }

        function addPhotoToGallery() {
            let dataUrl = hiddenCanvas.toDataURL('image/jpeg', 0.9);
            let img = document.createElement('img');
            img.src = dataUrl;
            img.className = 'snap-img';
            img.title = "點擊下載這張照片";
            
            img.onclick = function() {
                let link = document.createElement('a');
                let timestamp = new Date().toISOString().replace(/[-:T]/g, "").slice(0, 14);
                link.download = `snap_${timestamp}.jpg`;
                link.href = dataUrl;
                link.click();
            };
            
            gallery.prepend(img);
        }
    </script>
</body>
</html>
